services:
  dealdrop-api:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
    command: ["npm", "run", "server:start"]
    env_file:
      - ../../server/.env
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
    ports:
      - "3000:3000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health/live').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dealdrop-worker:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
    command: ["npm", "run", "server:worker:watchlists:prod"]
    env_file:
      - ../../server/.env
    environment:
      NODE_ENV: production
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
